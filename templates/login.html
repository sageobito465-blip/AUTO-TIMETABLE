{% extends "base.html" %}

{% block title %}Login{% endblock %}

{% block content %}

    <div class="login-page">
        <div class="login-box">
            <div class="login-icon" aria-hidden="true">🔒</div>

            <p class="login-eyebrow">Moshood Abiola Polytechnic</p>
            <h2>MAPOLY Timetable</h2>
            <p class="subtitle">Sign in to access your academic schedule</p>

            {% if message %}
            <p class="login-message">{{ message }}</p>
            {% endif %}

            <form method="POST" action="/login">
                <div class="login-field">
                    <label for="login-username">Username</label>
                    <input id="login-username" type="text" name="username" placeholder="Enter your username">
                </div>
                <div class="login-field">
                    <label for="login-password">Password</label>
                    <input id="login-password" type="password" name="password" placeholder="Enter your password">
                </div>
                <button type="submit">Log in</button>
            </form>
        </div>
    </div>

{% endblock %}
