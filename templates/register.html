{% extends "base.html" %}

{% block title %}Register New User{% endblock %}

{% block content %}

    <div class="form-card">
        <div class="form-card-header">
            <p class="title">Register New User</p>
            <p class="subtitle">Create a login for a student, lecturer, or admin</p>
        </div>

        <div class="form-card-body">

            {% if message %}
            <p class="login-message">{{ message }}</p>
            {% endif %}

            <form method="POST" action="/admin/register">

                <div class="field-group course two-col">
                    <div>
                        <label>Username</label>
                        <input type="text" name="username" placeholder="e.g. student matric no or email" required>
                    </div>
                    <div>
                        <label>Password</label>
                        <input type="text" name="password" placeholder="Password" required>
                    </div>
                </div>

                <div class="field-group schedule two-col">
                    <div>
                        <label>Full Name</label>
                        <input type="text" name="full_name" placeholder="Full name" required>
                    </div>
                    <div>
                        <label>Email</label>
                        <input type="text" name="email" placeholder="Email address">
                    </div>
                </div>

                <div class="field-group staff two-col">
                    <div>
                        <label>Role</label>
                        <select name="role">
                            <option value="Student">Student</option>
                            <option value="Lecturer">Lecturer</option>
                            <option value="Admin">Admin</option>
                        </select>
                    </div>
                    <div>
                        <label>Level (Students only)</label>
                        <select name="level">
                            <option value="">N/A</option>
                            <option value="ND1">ND1</option>
                            <option value="ND2">ND2</option>
                            <option value="HND1">HND1</option>
                            <option value="HND2">HND2</option>
                        </select>
                    </div>
                </div>

                <button type="submit">Register</button>
            </form>
        </div>
    </div>

{% endblock %}
