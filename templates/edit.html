{% extends "base.html" %}

{% block title %}Edit User{% endblock %}

{% block content %}

    <div class="form-card">
        <div class="form-card-header">
            <p class="title">Edit User</p>
            <p class="subtitle">Update this user's details or role</p>
        </div>

        <div class="form-card-body">
            <form method="POST" action="/admin/edit/{{ user[0] }}">

                <div class="field-group course two-col">
                    <div>
                        <label>Username</label>
                        <input type="text" name="username" value="{{ user[1] }}">
                    </div>
                    <div>
                        <label>Full Name</label>
                        <input type="text" name="full_name" value="{{ user[2] }}">
                    </div>
                </div>

                <div class="field-group schedule two-col">
                    <div>
                        <label>Email</label>
                        <input type="text" name="email" value="{{ user[4] }}">
                    </div>
                    <div>
                        <label>Role</label>
                        <select name="role">
                            <option value="Student" {% if user[3] == "Student" %}selected{% endif %}>Student</option>
                            <option value="Lecturer" {% if user[3] == "Lecturer" %}selected{% endif %}>Lecturer</option>
                            <option value="Admin" {% if user[3] == "Admin" %}selected{% endif %}>Admin</option>
                        </select>
                    </div>
                </div>

                <div class="field-group staff two-col">
                    <div>
                        <label>Level (Students only)</label>
                        <select name="level">
                            <option value="" {% if user[5] == None %}selected{% endif %}>N/A</option>
                            <option value="ND1" {% if user[5] == "ND1" %}selected{% endif %}>ND1</option>
                            <option value="ND2" {% if user[5] == "ND2" %}selected{% endif %}>ND2</option>
                            <option value="HND1" {% if user[5] == "HND1" %}selected{% endif %}>HND1</option>
                            <option value="HND2" {% if user[5] == "HND2" %}selected{% endif %}>HND2</option>
                        </select>
                    </div>
                </div>

                <button type="submit">Save Changes</button>
            </form>
        </div>
    </div>

{% endblock %}
